# DB box (standalone): Postgres + TimescaleDB only. Data lives on the 20 GB /data disk, not the root disk.
services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg16   # pinned to the version that produced the dump
    container_name: halal_equity_postgres
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halal_equity}
      POSTGRES_USER: ${POSTGRES_USER:-halal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["/data/workspace/halal/pgdata:/var/lib/postgresql/data"]
    shm_size: 256m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halal_user} -d ${POSTGRES_DB:-halal_equity}"]
      interval: 10s
      timeout: 5s
      retries: 5
