# API box: frontend + backend (+quant for on-demand calls). The database is reached through the tunnel container, which takes over
# the service name "postgres" so no connection string changes. Background jobs are NOT run here.
services:
  postgres:
    image: halal-tunnel:1
    build: {context: ./deploy/instabox/tunnel}
    command: ["/tunnel.sh"]
    ports: !reset []
    volumes: !reset []
    environment: !override ["DB_SSH_USER=${DB_SSH_USER:?set in .env}", "FLEET_GATEWAY=ssh.instabox.sh", "FLEET_PORT=2222"]
    healthcheck: {test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"], interval: 10s, timeout: 3s, retries: 5}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  redis: {ports: !override ["127.0.0.1:6379:6379"], logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}}
  backend: {ports: !override ["127.0.0.1:8081:8080"], logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}}
  quant:
    ports: !override ["127.0.0.1:8000:8000"]
    volumes: !reset []
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  frontend: {ports: !override ["127.0.0.1:3000:3000"], volumes: !reset [], logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}}
  worker: {profiles: ["jobs-box-only"]}
  prometheus: {profiles: ["monitoring"]}
  grafana: {profiles: ["monitoring"]}
