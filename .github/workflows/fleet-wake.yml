name: fleet-wake
# Wakes the three Instabox servers from outside (they suspend themselves after about 8 h of run time and cannot wake themselves).
# One-time setup: repo Settings > Secrets and variables > Actions > New repository secret
#   FLEET_API_SSH_USER = the box-1 ibssh_... string (same value as DEPLOY_API_SSH_USER on the Mac)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wake the fleet
        env:
          FLEET_API_SSH_USER: ${{ secrets.FLEET_API_SSH_USER }}
        run: |
          if [ -z "$FLEET_API_SSH_USER" ]; then echo "::warning::secret FLEET_API_SSH_USER is not set; the fleet is not being woken"; exit 0; fi
          deploy/instabox/wake.sh
