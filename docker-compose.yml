
services:
  # ---- PostgreSQL + TimescaleDB ----
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: halal_equity_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halal_equity}
      POSTGRES_USER: ${POSTGRES_USER:-halal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halal_user} -d ${POSTGRES_DB:-halal_equity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: halal_equity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Go Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halal_equity_backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-halal_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-halal_equity}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - QUANT_ENGINE_URL=http://quant:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-10}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - PAPER_TRADING_ENABLED=true
      - LIVE_ORDER_EXECUTION=false
      - BROKER_TRADING_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Go Background Worker ----
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halal_equity_worker
    restart: unless-stopped
    command: ["/app/bin/worker"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-halal_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-halal_equity}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - QUANT_ENGINE_URL=http://quant:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- Python Quant Engine ----
  quant:
    build:
      context: ./quant
      dockerfile: Dockerfile
    container_name: halal_equity_quant
    restart: unless-stopped
    ports:
      - "${QUANT_ENGINE_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-halal_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-halal_equity}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./quant:/app

  # ---- Next.js Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: halal_equity_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ---- Prometheus Metrics ----
  prometheus:
    image: prom/prometheus:latest
    container_name: halal_equity_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # ---- Grafana Dashboard ----
  grafana:
    image: grafana/grafana:latest
    container_name: halal_equity_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: halal_equity_network
